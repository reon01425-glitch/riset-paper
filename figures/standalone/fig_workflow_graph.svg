<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9Z" fill="#000"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9Z" fill="#666"/>
    </marker>
  </defs>
  <rect width="900" height="600" fill="#fff"/>

  <!-- Root -->
  <rect x="315" y="20" width="270" height="58" rx="2" fill="#d9d9d9" stroke="#000" stroke-width="1.6"/>
  <rect x="319" y="24" width="262" height="50" rx="1" fill="none" stroke="#000" stroke-width="0.6"/>
  <text x="450" y="45" font-size="15" font-weight="bold" text-anchor="middle">SOP root: Academic Leave</text>
  <text x="450" y="64" font-size="12" text-anchor="middle" fill="#333">title · aliases · max. duration</text>

  <!-- HAS_STEP -->
  <g stroke="#666" stroke-width="1.1" stroke-dasharray="6 4" fill="none">
    <line x1="400" y1="78" x2="178" y2="148" marker-end="url(#ag)"/>
    <line x1="425" y1="78" x2="312" y2="148" marker-end="url(#ag)"/>
    <line x1="450" y1="78" x2="450" y2="148" marker-end="url(#ag)"/>
    <line x1="475" y1="78" x2="586" y2="148" marker-end="url(#ag)"/>
    <line x1="500" y1="78" x2="722" y2="148" marker-end="url(#ag)"/>
  </g>

  <!-- Steps -->
  <g font-size="14" font-weight="bold" text-anchor="middle">
    <rect x="115" y="150" width="110" height="46" rx="10" fill="#fff" stroke="#000" stroke-width="1.6"/>
    <text x="170" y="178">Step 1</text>
    <rect x="255" y="150" width="110" height="46" rx="10" fill="#fff" stroke="#000" stroke-width="1.6"/>
    <text x="310" y="178">Step 2</text>
    <rect x="395" y="150" width="110" height="46" rx="10" fill="#fff" stroke="#000" stroke-width="1.6"/>
    <text x="450" y="178">Step 3</text>
    <rect x="535" y="150" width="110" height="46" rx="10" fill="#fff" stroke="#000" stroke-width="1.2" stroke-dasharray="5 3"/>
    <text x="590" y="178" font-weight="normal">Steps 4–7</text>
    <rect x="675" y="150" width="110" height="46" rx="10" fill="#fff" stroke="#000" stroke-width="1.6"/>
    <text x="730" y="178">Step 8</text>
  </g>

  <!-- NEXT_STEP -->
  <g stroke="#000" stroke-width="2.6" fill="none">
    <line x1="225" y1="173" x2="251" y2="173" marker-end="url(#a)"/>
    <line x1="365" y1="173" x2="391" y2="173" marker-end="url(#a)"/>
    <line x1="505" y1="173" x2="531" y2="173" marker-end="url(#a)"/>
    <line x1="645" y1="173" x2="671" y2="173" marker-end="url(#a)"/>
  </g>

  <!-- PERFORMS -->
  <g stroke="#000" stroke-width="1.2" stroke-dasharray="1.5 3" stroke-linecap="round" fill="none">
    <line x1="185" y1="266" x2="172" y2="200" marker-end="url(#a)"/>
    <line x1="225" y1="268" x2="300" y2="200" marker-end="url(#a)"/>
    <line x1="450" y1="266" x2="450" y2="200" marker-end="url(#a)"/>
    <line x1="710" y1="266" x2="728" y2="200" marker-end="url(#a)"/>
  </g>

  <!-- Actors -->
  <g font-size="14" text-anchor="middle">
    <ellipse cx="200" cy="292" rx="72" ry="25" fill="#efefef" stroke="#000" stroke-width="1.2"/>
    <text x="200" y="297">Actor A</text>
    <ellipse cx="450" cy="292" rx="72" ry="25" fill="#efefef" stroke="#000" stroke-width="1.2"/>
    <text x="450" y="297">Actor B</text>
    <ellipse cx="700" cy="292" rx="72" ry="25" fill="#efefef" stroke="#000" stroke-width="1.2"/>
    <text x="700" y="297">Actor C</text>
  </g>

  <!-- Attribute panel -->
  <rect x="115" y="345" width="670" height="142" rx="4" fill="#fafafa" stroke="#000" stroke-width="0.8"/>
  <text x="135" y="370" font-size="14" font-weight="bold">Attributes of each step node v<tspan font-size="10" dy="3">i</tspan></text>
  <g font-size="12.5" text-anchor="middle">
    <rect x="135" y="388" width="205" height="38" rx="3" fill="#fff" stroke="#000" stroke-width="0.8"/>
    <text x="237.5" y="411">actor (performer)</text>
    <rect x="348" y="388" width="205" height="38" rx="3" fill="#fff" stroke="#000" stroke-width="0.8"/>
    <text x="450.5" y="411">action</text>
    <rect x="561" y="388" width="205" height="38" rx="3" fill="#fff" stroke="#000" stroke-width="0.8"/>
    <text x="663.5" y="411">inputs (required documents)</text>
    <rect x="135" y="434" width="205" height="38" rx="3" fill="#fff" stroke="#000" stroke-width="0.8"/>
    <text x="237.5" y="457">output (artifact)</text>
    <rect x="348" y="434" width="205" height="38" rx="3" fill="#fff" stroke="#000" stroke-width="0.8"/>
    <text x="450.5" y="457">duration (estimate)</text>
    <rect x="561" y="434" width="205" height="38" rx="3" fill="#fff" stroke="#000" stroke-width="0.8"/>
    <text x="663.5" y="457">evidence (verbatim PDF quote)</text>
  </g>

  <!-- Legend: edges -->
  <g font-size="12.5">
    <line x1="115" y1="527" x2="160" y2="527" stroke="#666" stroke-width="1.1" stroke-dasharray="6 4" marker-end="url(#ag)"/>
    <text x="168" y="531">HAS_STEP (root → step)</text>
    <line x1="350" y1="527" x2="395" y2="527" stroke="#000" stroke-width="2.6" marker-end="url(#a)"/>
    <text x="403" y="531">NEXT_STEP (step order)</text>
    <line x1="590" y1="527" x2="635" y2="527" stroke="#000" stroke-width="1.2" stroke-dasharray="1.5 3" stroke-linecap="round" marker-end="url(#a)"/>
    <text x="643" y="531">PERFORMS (actor → step)</text>
  </g>
  <!-- Legend: nodes -->
  <g font-size="12.5">
    <rect x="115" y="556" width="30" height="18" fill="#d9d9d9" stroke="#000" stroke-width="1.2"/>
    <text x="153" y="570">SOP root node</text>
    <rect x="350" y="556" width="30" height="18" rx="5" fill="#fff" stroke="#000" stroke-width="1.4"/>
    <text x="388" y="570">Step node</text>
    <ellipse cx="605" cy="565" rx="15" ry="9" fill="#efefef" stroke="#000" stroke-width="1.1"/>
    <text x="628" y="570">Actor node</text>
  </g>
</svg>
