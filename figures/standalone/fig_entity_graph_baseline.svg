<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9Z" fill="#000"/>
    </marker>
  </defs>
  <rect width="900" height="560" fill="#fff"/>

  <!-- Query -->
  <rect x="290" y="20" width="320" height="46" rx="4" fill="#fff" stroke="#000" stroke-width="1.2"/>
  <text x="450" y="48" font-size="14" text-anchor="middle">User query</text>
  <line x1="450" y1="66" x2="450" y2="104" stroke="#000" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="462" y="90" font-size="12" fill="#333">keyword match</text>

  <!-- Matched entity -->
  <ellipse cx="450" cy="138" rx="120" ry="32" fill="#d9d9d9" stroke="#000" stroke-width="2"/>
  <text x="450" y="135" font-size="14" font-weight="bold" text-anchor="middle">“cuti akademik”</text>
  <text x="450" y="154" font-size="12" text-anchor="middle" fill="#333">matched entity</text>

  <!-- Undirected edges (1-hop) -->
  <g stroke="#000" stroke-width="1.4" fill="none">
    <line x1="370" y1="162" x2="215" y2="240"/>
    <line x1="450" y1="170" x2="450" y2="240"/>
    <line x1="530" y1="162" x2="685" y2="240"/>
  </g>
  <text x="160" y="190" font-size="12" font-style="italic" fill="#333">mengeluarkan surat izin</text>

  <!-- 1-hop neighbours -->
  <g font-size="14" text-anchor="middle">
    <ellipse cx="200" cy="264" rx="92" ry="25" fill="#efefef" stroke="#000" stroke-width="1.4"/>
    <text x="200" y="269">“dekan”</text>
    <ellipse cx="450" cy="264" rx="92" ry="25" fill="#efefef" stroke="#000" stroke-width="1.4"/>
    <text x="450" y="269">entity</text>
    <ellipse cx="700" cy="264" rx="92" ry="25" fill="#efefef" stroke="#000" stroke-width="1.4"/>
    <text x="700" y="269">entity</text>
  </g>

  <!-- 2-hop (not expanded) -->
  <g stroke="#888" stroke-width="1" stroke-dasharray="4 4" fill="none">
    <line x1="200" y1="289" x2="200" y2="335"/>
    <line x1="700" y1="289" x2="700" y2="335"/>
    <ellipse cx="200" cy="358" rx="92" ry="23"/>
    <ellipse cx="700" cy="358" rx="92" ry="23"/>
  </g>
  <g font-size="12" text-anchor="middle" fill="#666">
    <text x="200" y="362">2-hop (not expanded)</text>
    <text x="700" y="362">2-hop (not expanded)</text>
  </g>

  <!-- 1-hop boundary -->
  <rect x="95" y="225" width="710" height="80" rx="8" fill="none" stroke="#000" stroke-width="0.8" stroke-dasharray="8 4"/>
  <text x="262" y="324" font-size="12" font-style="italic">1-hop neighbourhood</text>

  <!-- To prompt -->
  <line x1="450" y1="305" x2="450" y2="408" stroke="#000" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="300" y="410" width="300" height="56" rx="4" fill="#fff" stroke="#000" stroke-width="1.2"/>
  <text x="450" y="433" font-size="14" font-weight="bold" text-anchor="middle">Prompt context</text>
  <text x="450" y="453" font-size="12" text-anchor="middle" fill="#333">1-hop triples (h, r, t) → LLM</text>

  <!-- Legend -->
  <g font-size="12.5">
    <line x1="120" y1="512" x2="165" y2="512" stroke="#000" stroke-width="1.4"/>
    <text x="173" y="516">undirected edge (nx.Graph)</text>
    <ellipse cx="420" cy="512" rx="15" ry="9" fill="#efefef" stroke="#000" stroke-width="1.1"/>
    <text x="443" y="516">entity node</text>
    <ellipse cx="600" cy="512" rx="15" ry="9" fill="none" stroke="#888" stroke-width="1" stroke-dasharray="4 4"/>
    <text x="623" y="516">not retrieved</text>
  </g>
</svg>
